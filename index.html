<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harun ❤️ Asya</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(180deg,#050816,#0b1b3d);
overflow:hidden;
color:white;
}

.stars{
position:fixed;
width:100%;
height:100%;
background-image:radial-gradient(white 1px, transparent 1px);
background-size:40px 40px;
animation:move 30s linear infinite;
opacity:.5;
}

@keyframes move{
from{transform:translateY(0);}
to{transform:translateY(40px);}
}

.card{
position:relative;
z-index:10;
width:90%;
max-width:420px;
padding:35px;
border-radius:25px;
backdrop-filter:blur(18px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
text-align:center;
}

h1{
font-size:34px;
margin-bottom:10px;
}

p{
margin-bottom:25px;
opacity:.8;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
margin-bottom:15px;
outline:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
background:white;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="card">
<h1>Harun ❤️ Asya</h1>

<p>Her şey seninle güzel...</p>

<input type="password" placeholder="Şifre">

<button>Giriş Yap</button>

</div>

</body>
</html>
